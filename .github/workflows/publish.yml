name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    container: amazonlinux:2023
    steps:
      - name: Install system packages
        run: dnf install -y gcc git tar gzip unzip && dnf clean all
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build TypeScript
        run: bun run build
      - name: Build native proxy
        run: bun run build:proxy
      - name: Package native proxy
        run: bun run package:platform -- --target ${{ matrix.target }}
      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: npm/${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Release and publish
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Validate release type
        run: |
          case "${{ inputs.release_type }}" in
            patch|minor|major) ;;
            *) echo "release_type must be patch, minor, or major" >&2; exit 1 ;;
          esac
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Release commit
        run: bun run release -- "${{ inputs.release_type }}" --ci
      - name: Rebuild package entrypoint
        run: bun run build
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm
      - name: Sync platform package versions
        run: |
          for package_dir in npm/npm-*; do
            node -e "const fs=require('fs'); const path='$package_dir/package.json'; const root=require('./package.json'); const pkg=require('./'+path); pkg.version=root.version; fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n')"
          done
      - name: Publish platform packages
        run: |
          for package_dir in npm/npm-*; do
            npm publish "./$package_dir" --access public --provenance
          done
      - name: Publish main package
        run: npm publish --access public --provenance
